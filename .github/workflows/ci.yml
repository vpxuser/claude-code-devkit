name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      - name: Lint rules
        run: markdownlint .claude/rules/*.md

      - name: Lint templates
        run: markdownlint templates/*.md templates/*.template

      - name: Lint README & CHANGELOG
        run: markdownlint README.md CHANGELOG.md CONTRIBUTING.md

      - name: Lint GitHub templates
        run: markdownlint .github/**/*.md
